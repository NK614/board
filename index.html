}

function slotGroups(sportKey){
  const sportLabel = (SPORTS[sportKey] || {}).label || sportKey.toUpperCase();
  return slotsFor(sportKey).map(sl => ({
    sport: sportLabel, label: sl.label, short: sl.name,
    items: sl.games.map(g => {
      const d = kickOf(g);
      return {value: g, label: g, sub: d ? etParts(d).time : ""};
    }),
  }));
}

function buildGameSelect(){
  const sel = $("f-game"), prev = sel.value, slots = slotsFor(SPORT);
  sel.innerHTML = "";
  const values = [];
  slots.forEach(sl => {
    const grp = document.createElement("optgroup");
    grp.label = sl.label;
    if(sl.games.length > 1){
      grp.appendChild(new Option(`All ${sl.name} games (${sl.games.length})`, "slot:" + sl.key));
      values.push("slot:" + sl.key);
    }
    sl.games.forEach(g => {
      const d = kickOf(g);
      grp.appendChild(new Option(d ? `${g} · ${etParts(d).time}` : g, g));
      values.push(g);
    });
    sel.appendChild(grp);
  });
  if(values.includes(prev)){ sel.value = prev; return; }
  // Default: the next window that has not finished (kicked off under ~4h ago).
  const soon = slots.find(sl => sl.t > Date.now() - 4 * 3600e3) || slots[0];
  if(soon) sel.value = soon.games.length > 1 ? "slot:" + soon.key : soon.games[0];
}
function selectedGames(){
  const v = $("f-game").value || "";
  if(v.startsWith("slot:")){
    const sl = slotsFor(SPORT).find(x => "slot:" + x.key === v);
    return sl ? sl.games : [];
  }
  return v ? [v] : [];
}

function buildFilters(){
  const s = S();
  buildGameSelect();
  fill($("f-market"), s.markets || [], m => (SHARED.labels || {})[m] || m);
  fill($("f-book"), s.books || [], bookName);
}

function render(){
  const s = S();
  const games = selectedGames(), market = $("f-market").value, book = $("f-book").value;
  const board = $("board");
  const unit = (SHARED.units || {})[market] || "";

  const rows = (s.rows || []).filter(r =>
    games.includes(r.game) && r.market === market && r.book === book);

  if(!games.length){
    board.innerHTML = `<div class="empty">Pick at least one game above.</div>`;
    return;
  }
  if(!rows.length){
    // One sentence, in the reader's terms. The previous version explained the
    // internals and printed a terminal command, which is a developer's answer
    // to a question the page can answer plainly.
    board.innerHTML = `<div class="empty">No active lines for this prop on `
      + `${bookName(book)}.</div>`;
    return;
  }

  const byPlayer = new Map();
  rows.forEach(r => {
    if(!byPlayer.has(r.player)) byPlayer.set(r.player, []);
    byPlayer.get(r.player).push(r);
  });


  // Busiest players first. With no verdict to rank by, volume is the most
  // useful ordering -- the names you are most likely to be looking for.
  const order = [...byPlayer.entries()].sort((a,b) => b[1][0].mean - a[1][0].mean);

  const card = ([player, rs]) => {
    const p = rs[0];
    const stale = rs.some(r => r.verdict === "role");
    const missed = p.eligible - p.games;
    const prior = p.prior_teams || [];
    const withTeam = (p.with_team == null) ? p.games : p.with_team;
    const elsewhere = p.games - withTeam;
    const mostlyElsewhere = elsewhere > 0 && withTeam < p.games / 2;

    const notes = [];

    if(stale){
      notes.push(`<div class="note-strip s-crit"><span class="tag">Role changed</span>
        <span><b>Check the injury report.</b> ${bookName(p.book)}'s line
        (${p.std_line}) sits well below his ${p.mean.toFixed(1)} ${unit} average.
        They know something the history doesn't.</span></div>`);
    }

    if(mostlyElsewhere){
      notes.push(`<div class="note-strip s-warn"><span class="tag">Other team</span>
        <span>Only <b>${withTeam}</b> of these ${p.games} games
        ${withTeam === 1 ? "was" : "were"} played for ${p.team} — the other
        ${elsewhere} came with ${prior.join(" and ")}. Hands travel between teams;
        usage doesn't.</span></div>`);
    }

    if(p.short){
      notes.push(`<div class="note-strip s-warn"><span class="tag">Short history</span>
        <span>Only <b>${p.games}</b> game${p.games === 1 ? "" : "s"} on record. Every
        rate below is ${p.games} game${p.games === 1 ? "" : "s"}, not a pattern — shown
        because the book is pricing him, not because the numbers mean much yet.</span></div>`);
    }

    const dfn = defenseFor(p);
    const faced = ((s.profiles || {})[normName(player)] || {}).faced || {};
    const facedRank = faced[market];
    if(dfn){
      let cls = "s-flat", tag = "Matchup", verdict = "";
      if(facedRank != null){
        const gap = dfn.rank - facedRank;
        if(gap >= 6){
          cls = "s-good"; tag = "Favorable";
          verdict = ` Softer than his usual — the defenses behind that hit rate
            averaged ${ordinal(Math.round(facedRank))}.`;
        } else if(gap <= -6){
          cls = "s-crit"; tag = "Tough";
          verdict = ` Harder than his usual — the defenses behind that hit rate
            averaged ${ordinal(Math.round(facedRank))}, so read that rate as a
            ceiling.`;
        } else {
          tag = "Neutral";
          verdict = ` About what he has been facing
            (${ordinal(Math.round(facedRank))} on average).`;
        }
      }
      const thin = dfn.games < 3
        ? ` Only ${dfn.games} game${dfn.games===1?"":"s"} in so far, so this leans
            on last season.` : "";
      notes.push(`<div class="note-strip ${cls}"><span class="tag">${tag}</span>
        <span><b>${dfn.team} — ${ordinal(dfn.rank)} of ${dfn.of}</b> against
        ${p.pos}s in ${unit} allowed (${dfn.perGame} a game).${verdict}${thin}</span>
        </div>`);
    }

    const addable = rs.some(r => legId(r));
    const prof = (s.profiles || {})[normName(player)] || {};
    const stat = ((SHARED.marketMeta || {})[market] || {}).stat;
    const allVals = ((prof.stats || {})[stat] || {}).values || [];
    const last10 = allVals.slice(-10);
    const med = median(allVals);

    // Median vs average vs line. Yardage is lopsided: a few huge games drag
    // the average up, so "his average clears the line" overstates how often
    // he actually gets there. Flagged only when the line sits between them.
    if(med != null && p.std_line != null && med < p.std_line && p.mean > p.std_line){
      notes.push(`<div class="note-strip s-warn"><span class="tag">Big-game average</span>
        <span>His average (<b>${p.mean.toFixed(1)}</b>) clears the ${p.std_line} line, but his
        typical game — the median — is <b>${fmtNum(med)}</b>. A few big games pull the
        average up; in most games he has finished under this number.</span></div>`);
    }

    // Role trend: the last 3 games against the rest of the window.
    const kind = stat === "passing_yards" ? "att" : volumeKind(stat);
    const u = (prof.usage || {})[kind];
    if(u && u.dir){
      const label = {tgt: "Target share", car: "Carry share", att: "Pass attempts"}[kind];
      const f = kind === "att" ? (x => `${fmtNum(x)} a game`) : (x => `${Math.round(x * 100)}%`);
      notes.push(`<div class="note-strip ${u.dir === "up" ? "s-good" : "s-warn"}">
        <span class="tag">${u.dir === "up" ? "Role growing" : "Role shrinking"}</span>
        <span>${label} <b>${f(u.recent)}</b> over his last ${u.n} games,
        ${u.dir === "up" ? "up" : "down"} from ${f(u.base)} in the ${u.nbase} before.
        The hit rate is built mostly on the old role.</span></div>`);
    }

    // Teammates ruled out, with the volume they leave behind.
    const vk = volumeKind(stat), vmin = vk === "car" ? 0.25 : 0.10;
    const gone = ((s.outs || {})[p.team] || []).filter(o =>
      normName(o.player) !== normName(player) && (o[vk] || 0) >= vmin);
    if(gone.length){
      const what = vk === "car" ? "carries" : "targets";
      notes.push(`<div class="note-strip s-flat"><span class="tag">Teammate out</span>
        <span>${gone.map(o => `<b>${esc(o.player)}</b> (${esc(o.pos)}, ${o.status.toLowerCase()})
        — ${Math.round(o[vk] * 100)}% of the team's ${what}`).join("; ")}.
        ${stat === "passing_yards" ? "Fewer proven targets to throw to."
          : "That volume goes to someone, and the line may not have fully caught up."}</span></div>`);
    }

    // Starting QB out.
    const qo = qbOut(p.team, player);
    if(qo && (stat === "receptions" || stat === "receiving_yards" || (stat === "passing_yards" && p.pos === "QB"))){
      notes.unshift(`<div class="note-strip s-warn"><span class="tag">Backup QB</span>
        <span>${esc(qbOutText(qo, stat, p.pos))}</span></div>`);
    }

    // Game script, only when the spread is big enough to change play-calling.
    const gl = (s.lines || {})[p.game];
    if(gl && gl.fav){
      const big = SPORT === "cfb" ? 14 : 7, sp = fmtNum(gl.spread);
      const passing = stat === "passing_yards" || stat === "receptions" || stat === "receiving_yards";
      let tag = "", txt = "", cls = "s-flat";
      if(SPORT === "cfb" && p.team === gl.fav && gl.spread >= 21){
        cls = "s-warn"; tag = "Blowout risk";
        txt = `Favored by ${sp}. Starters often sit in the fourth quarter of a blowout, which caps overs.`;
      }else if(gl.spread >= big && p.team === gl.fav && stat === "rushing_yards"){
        cls = "s-good"; tag = "Game script";
        txt = `Favored by ${sp}. Teams protecting a lead run more late, which adds carries.`;
      }else if(gl.spread >= big && p.team === gl.dog && passing){
        cls = "s-good"; tag = "Game script";
        txt = `${sp}-point underdog. Teams that fall behind throw more, often late.`;
      }else if(gl.spread >= big && p.team === gl.dog && stat === "rushing_yards"){
        cls = "s-warn"; tag = "Game script";
        txt = `${sp}-point underdog. Trailing teams move away from the run.`;
      }
      if(tag) notes.push(`<div class="note-strip ${cls}"><span class="tag">${tag}</span>
        <span>${txt}</span></div>`);
    }

    // His own injury status goes first -- it can make everything else moot.
    const st = prof.status;
    if(st && st.status){
      const inj = st.injury ? ` (${esc(st.injury.toLowerCase())})` : "";
      const out = st.status === "Out" || st.status === "Doubtful";
      notes.unshift(`<div class="note-strip ${out ? "s-crit" : "s-warn"}">
        <span class="tag">${esc(st.status)}</span>
        <span>${out
          ? `Listed ${st.status.toLowerCase()}${inj}. If he doesn't play, most books void the prop, but check your book's rule.`
          : `Listed questionable${inj}. Check the inactives list about 90 minutes before kickoff.`}</span></div>`);
    }
    const body = rs.slice().sort((a,b) => a.threshold - b.threshold).map(r => {
      const id = legId(r), on = id && SLIP.has(id);
      const add = !addable ? "" : `<td class="add">${id ? `<button class="addbtn"
          data-leg="${esc(id)}" aria-pressed="${on}"
          aria-label="${on ? "Remove" : "Add"} ${player} ${Math.ceil(r.threshold)}+ ${unit} ${on ? "from" : "to"} parlay"
          >${on ? "&#10003;" : "+"}</button>` : ""}</td>`;
      return `<tr${on ? ' class="picked"' : ""}>
        <td class="target">${Math.ceil(r.threshold)}+</td>
        <td class="mono">${american(r.price)}</td>
        <td class="mono hit${p.short ? " few" : ""}">${pct(r.hit)}<span class="sub">${r.hits}/${r.n}</span><span class="meter"><i style="--w:${Math.round(r.hit * 100)}%"></i></span></td>
        ${rateCell(rateOver(last10, r.threshold), "Hit rate in his last 10 games")}
        ${add}
      </tr>`;
    }).join("");

    return `<article class="player">
      <div class="phead">
        <span class="pwho">${badgeFor(p.team)}<span class="pname">${player}</span></span>
        <span class="chip">${p.pos} · ${p.team}</span>
        <div class="pfacts">
          <div class="st"><span class="k">Avg</span><span class="v">${p.mean.toFixed(1)}</span></div>
          <div class="st"><span class="k">Median</span><span class="v">${med != null ? fmtNum(med) : "—"}</span></div>
          <div class="st hl"><span class="k">${({fanduel: "FD", draftkings: "DK"})[p.book] || bookName(p.book)} line</span><span class="v">${p.std_line != null ? p.std_line : "—"}</span></div>
          <div class="st"><span class="k">Games</span><span class="v">${p.games}<small>/${p.eligible}</small></span></div>
        </div>
        <div class="pmeta">${unit ? `${unit[0].toUpperCase() + unit.slice(1)} · ` : ""}back to <b>${p.since || "—"}</b>${p.dnp > 0 ? ` · sat out ${p.dnp} (not counted)` : ""}${missed > 0 ? ` · ${missed} game${missed === 1 ? "" : "s"} not recorded` : ""}${elsewhere > 0 ? ` · <b>${withTeam}</b> with ${p.team}, ${elsewhere} with ${prior.join("/")}` : ""}</div>
      </div>
      ${notes.join("")}
      <div class="tablewrap"><table class="${addable ? "c5" : "c4"}">
        <thead><tr>
          <th>Needs<span class="unit">${unit}</span></th>
          <th class="help" title="What the book pays">Odds</th>
          <th class="help" title="How often he cleared this number, with the raw count">Hit rate</th>
          <th class="help" title="Hit rate in his last 10 games">L-10</th>
          ${addable ? '<th><span class="sr">Parlay</span></th>' : ""}
        </tr></thead>
        <tbody>${body}</tbody>
      </table></div>
    </article>`;
  };

  // One section per game, in kickoff order: matchup and time, the line,
  // then that game's players.
  board.innerHTML = games.map(g => {
    const cards = order.filter(([, rs]) => rs[0].game === g);
    if(!cards.length) return "";
    const when = kickText(g, true);
    return `<div class="gamehead"><span class="gh-m">${esc(g)}</span>`
      + `${when ? `<span class="gh-t">${when}</span>` : ""}</div>`
      + gameLineBar(g) + cards.map(card).join("");
  }).join("");
}

/* -------------------------------------------------------------------------
   Parlay slip. Public on purpose: it spends nothing. The IDs are the books'
   own, baked in when the board was built, so the link is assembled right here
   in the browser -- no server, no key, nothing a friend can burn.
   ------------------------------------------------------------------------- */
const FD_SLIP = "https://sportsbook.fanduel.com/addToBetslip";
const DK_SLIP = "https://sportsbook.draftkings.com/";
const BOOKS = [["fanduel", "FanDuel", "fd"], ["draftkings", "DraftKings", "dk"]];
const SLIP = new Map();
function legId(r){
  if(!r) return null;
  if(r.book === "fanduel" && r.fd && r.fd[0] && r.fd[1])
    return "fd:" + r.fd[0] + ":" + r.fd[1];
  if(r.book === "draftkings" && r.dk) return "dk:" + r.dk;
  return null;
}

// Keyed to the build, so a new board never inherits legs from an old one.
const SLIP_STORE = "propboard_slip:" + Object.values(SPORTS).map(x => x.stamp).join("|");

function allRows(){
  return Object.values(SPORTS).flatMap(x => x.rows || []);
}
function findRow(id){
  return allRows().find(r => legId(r) === id) || null;
}
function saveSlip(){
  try{ localStorage.setItem(SLIP_STORE, JSON.stringify([...SLIP.keys()])); }catch(e){}
}
function loadSlip(){
  try{
    const ids = JSON.parse(localStorage.getItem(SLIP_STORE) || "[]");
    ids.forEach(id => { const r = findRow(id); if(r) SLIP.set(id, r); });
  }catch(e){}
}

function toggleLeg(id){
  if(SLIP.has(id)){
    SLIP.delete(id);
  }else{
    const r = findRow(id);
    if(!r) return;
    // One rung per player per stat per book. 3+ and 5+ catches for the same
    // receiver is the same bet twice, and books reject the pair on a
    // same-game slip -- so picking a new rung swaps out the old one.
    for(const [k, v] of SLIP){
      if(v.player === r.player && v.market === r.market && v.book === r.book)
        SLIP.delete(k);
    }
    SLIP.set(id, r);
  }
  saveSlip();
  render();
  renderSlip();
}

function slipUrl(book){
  const legs = [...SLIP.values()].filter(r => r.book === book);
  if(book === "draftkings"){
    // IDs joined by a literal "+". encodeURIComponent turns the "#" inside
    // prop IDs back into %23 -- left raw, the browser would treat everything
    // after it as a page anchor and the slip would lose those legs.
    return DK_SLIP + "?outcomes=" + legs.map(r => encodeURIComponent(r.dk)).join("+");
  }
  // Indexed even for one leg -- that is the form FanDuel's own share links use.
  const q = legs.map((r, i) =>
    `marketId%5B${i}%5D=${encodeURIComponent(r.fd[0])}`
    + `&selectionId%5B${i}%5D=${encodeURIComponent(r.fd[1])}`).join("&");
  return FD_SLIP + "?" + q;
}

function esc(t){
  return String(t == null ? "" : t).replace(/[&<>"]/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
}

/* ---- parlay math ----
   A parlay pays the PRODUCT of each leg's decimal odds. That is exactly how
   a book prices legs from different games. Legs from the same game are
   correlated and the book prices them together (a same-game parlay), so for
   those the tally is an estimate and says so. */
/* "5+ rushing yards", "1+ catches" -- the market's own label, so a yards line
   always says WHICH yards. */
function propText(r){
  const label = ((SHARED.labels || {})[r.market] || (SHARED.units || {})[r.market] || "").toLowerCase();
  return `${Math.ceil(r.threshold)}+ ${esc(label)}`;
}
const decOf = a => a > 0 ? 1 + a / 100 : 1 + 100 / (-a);
const amerOf = d => d >= 2 ? Math.round((d - 1) * 100) : -Math.round(100 / (d - 1));
const fmtAmer = a => (a > 0 ? "+" : "") + a.toLocaleString("en-US");
const parlayDec = legs => legs.reduce((d, r) => d * decOf(r.price), 1);
const sameGame = legs => new Set(legs.map(r => r.game)).size < legs.length;

function renderSlip(){
  const bar = $("slip"), n = SLIP.size;
  bar.hidden = n === 0;
  document.body.classList.toggle("has-slip", n > 0);
  if(!n){ bar.classList.remove("open"); return; }

  $("slip-n").textContent = n;
  $("slip-label").textContent = n === 1 ? "leg" : "legs";
  const used = BOOKS.filter(([b]) => [...SLIP.values()].some(r => r.book === b));
  $("slip-gos").innerHTML = used.map(([b, name]) => {
    const bl = [...SLIP.values()].filter(r => r.book === b), k = bl.length;
    const odds = fmtAmer(amerOf(parlayDec(bl)));
    const text = used.length === 1 ? `${name} ${odds}` : `${name} (${k}) ${odds}`;
    return `<a class="slip-go${b === "draftkings" ? " dk" : ""}" data-book="${b}"
      href="${esc(slipUrl(b))}" target="_blank" rel="noopener">${text}</a>`;
  }).join("");

  const legs = used.map(([b, name]) => {
    const bl = [...SLIP.values()].filter(r => r.book === b), d = parlayDec(bl);
    const sgp = sameGame(bl);
    const head = `<div class="leg-book"><span>${name} · ${bl.length} leg${bl.length === 1 ? "" : "s"}</span>
      <span class="parlay-odds">${fmtAmer(amerOf(d))}${sgp ? "*" : ""}
      <span class="payout">$10 pays $${(10 * d).toFixed(2)}</span></span></div>`;
    return head + [...SLIP.entries()].filter(([, r]) => r.book === b).map(([id, r]) => {
    const unit = (SHARED.units || {})[r.market] || "";
    return `<div class="leg">
      <div class="leg-main">
        <div class="leg-what">${esc(r.player)} <span class="pg-pos">${esc(r.pos || "")}</span></div>
        <div class="leg-prop">${propText(r)}</div>
        <div class="leg-where">${esc(r.game)}${kickOf(r.game) ? ` · ${kickText(r.game)}` : ""}</div>
      </div>
      <span class="leg-price">${american(r.price)}</span>
      <button class="leg-x" data-leg="${esc(id)}" aria-label="Remove ${esc(r.player)}">&times;</button>
    </div>`;
  }).join("");
  }).join("");
  const anySgp = used.some(([b]) => sameGame([...SLIP.values()].filter(r => r.book === b)));
  $("slip-list").innerHTML = legs + `<div class="slip-foot">
      <span>Parlay odds multiply each leg's price from when this board was built.
      ${anySgp ? "<b>*</b> Includes legs from the same game: the book prices those "
        + "together, so its number will differ. " : ""}The book shows the real
      price when it opens.</span>
      <button class="slip-clear" id="slip-clear">Clear all</button>
    </div>`;
}


/* =========================================================================
   PARLAY GENERATOR

   What it maximises. For a fixed payout D = d1 x d2 x ... x dn, the chance
   the parlay hits is p1 x p2 x ... x pn. Holding D fixed, that product is
   largest when each leg's p x d -- our estimate against the book's price --
   is largest. So the "most likely to hit at these odds" parlay is the one
   built from the legs the board rates most above their price. The search
   below finds it exactly (within rounding), with one leg per player.

   How a leg is rated -- and the honest limits of it:
   1. His hit rate at that number, SHRUNK toward the book's own implied
      probability (the book's price counted as 16 games of evidence, 32 for
      a short history). Raw hit rates on 24 games swing +/-15 points; without
      this, the search would chase the luckiest small samples.
   2. Last-10 blended in at a quarter weight.
   3. Small nudges, capped together at +/-0.35 on the log-odds scale:
      role growing/shrinking, matchup softer/tougher than his usual, game
      script, a teammate ruled out, and questionable status. These sizes are
      judgment, not fitted -- there is no settled-results backtest behind them.
   Excluded: anyone listed Out or Doubtful, "role changed" lines (the book
   knows something the history does not), and short histories (under six
   recorded games).
   ========================================================================= */
const PG_K = 16, PG_TILT_CAP = 0.35, PG_MISS = 0.5;
// Leg-picking rules added after grading week 3 -- steadiness, and no matchup
// nudge until defenses have 4 games this season (see rateLeg). A switch so
// the old and new rules can be compared on the same board.
let ALGO_V2 = true;
const PG_LONGSHOT_EDGE = 0.05;
const PG_STACK_PHI = 0.25;
const PG_AMBER_COST = 1.0;      // fallback only: how hard an amber flag counts against a leg      // QB-receiver link, measured on 2024-26 games (0.22-0.32)
const logit = p => Math.log(p / (1 - p)), sigm = x => 1 / (1 + Math.exp(-x));
const clampP = p => Math.min(0.985, Math.max(0.015, p));

function withSport(key, fn){
  const saved = SPORT; SPORT = key;
  try{ return fn(); } finally { SPORT = saved; }
}

function rateLeg(sportKey, r){
  return withSport(sportKey, () => {
    const s = S(), prof = (s.profiles || {})[normName(r.player)] || {};
    const status = prof.status && prof.status.status;
    if(status === "Out" || status === "Doubtful" || r.verdict === "role") return null;
    // Fewer than six recorded games is flagged "Short history" on the board.
    // Two good games can rate a leg near-certain; a parlay built on that is
    // built on noise, so those players are left out of the generator.
    if(r.short || prof.short) return null;
    const meta = (SHARED.marketMeta || {})[r.market] || {}, stat = meta.stat;
    const q = impliedFrom(r.price) / 1.045;          // strip a typical ~4.5% hold
    const k = prof.short ? 2 * PG_K : PG_K;
    let tilt = 0; const why = [];

    // UNRECORDED GAMES. The stats feeds list a player only in games where he
    // recorded a stat, so a game he played and caught nothing is simply
    // absent -- indistinguishable from a game he sat out. Counting only
    // recorded games makes "1+ catches" look near-certain (Inniss: 19 for 19,
    // with 5 of Ohio State's 24 games missing). Half of the missing games are
    // counted as misses: some were injuries, some were zeros, and the feed
    // cannot say which.
    const missing = Math.max(0, (r.eligible || 0) - (r.games || 0));
    const nAdj = r.n + PG_MISS * missing;
    if(missing >= 2) why.push([`${missing} games unrecorded`, "down",
      `${missing} of his team's games have no record of him, and the data can't tell whether he played `
      + `and recorded nothing or sat out. To be safe, the estimate counts half of them as misses.`]);

    const pFull = (r.hits + k * q) / (nAdj + k);
    const vals = ((prof.stats || {})[stat] || {}).values || [];
    const l10 = vals.slice(-10), h10 = l10.filter(v => v > r.threshold).length;
    let p = l10.length ? 0.75 * pFull + 0.25 * (h10 + k * q) / (l10.length + k) : pFull;

    // VOLUME. Catches are a count: a receiver averaging 2.5 a game goes
    // catchless roughly one game in twelve however many games in a row he
    // has recorded one. His average (with the unrecorded games partly as
    // zeros) gives that directly, and it is blended in at half weight.
    const recVals = ((prof.stats || {}).receptions || {}).values || [];
    const recMean = recVals.length ? recVals.reduce((a, v) => a + v, 0) / (recVals.length + PG_MISS * missing) : null;
    if(stat === "receptions" && recMean != null){
      const need = Math.floor(r.threshold) + 1;
      let cdf = 0, term = Math.exp(-recMean);
      for(let i = 0; i < need; i++){ cdf += term; term *= recMean / (i + 1); }
      p = 0.5 * p + 0.5 * (1 - cdf);
    }
    // STEADINESS. How much his game-to-game numbers swing. A boom-or-bust
    // player's hit rate rests on a few big games; a steady one clears his
    // number the same way most weeks.
    if(ALGO_V2 && vals.length >= 6){
      const mean = vals.reduce((a, v) => a + v, 0) / vals.length;
      const sd = Math.sqrt(vals.reduce((a, v) => a + (v - mean) ** 2, 0) / vals.length);
      const cv = mean > 0 ? sd / mean : 9;
      if(cv > 0.8){ tilt -= 0.10; why.push(["Boom or bust", "down",
        `His ${stat.replace(/_/g, " ")} swing a lot from game to game — some big games, some near zero. `
        + `His hit rate leans on the big ones, so any given week is shakier than it looks. Marked down.`]); }
      else if(cv < 0.45){ tilt += 0.05; why.push(["Steady", "up",
        `His ${stat.replace(/_/g, " ")} barely swing from game to game, so his hit rate is a reliable guide. Nudged up.`]); }
    }
    // USAGE. Low-volume receivers on yardage lines: target share where the
    // feed has it (NFL), catches a game where it does not (college).
    if(stat === "receiving_yards"){
      const t = (prof.usage || {}).tgt;
      const share = t ? t.base : null;
      if(share != null && share < 0.12){ tilt -= 0.10; why.push([`Low usage (${Math.round(share * 100)}% of targets)`, "down",
        `He gets only ${Math.round(share * 100)}% of his team's targets. With few looks, one quiet game `
        + `leaves him short, so yardage lines are riskier than his hit rate suggests. Marked down.`]); }
      else if(share == null && recMean != null && recMean < 2.5){
        tilt -= 0.10; why.push([`Low volume (${recMean.toFixed(1)} catches a game)`, "down",
        `He averages ${recMean.toFixed(1)} catches a game. With that few, one quiet game leaves him short, `
        + `so yardage lines are riskier than his hit rate suggests. Marked down.`]); }
    }
    const kind = stat === "passing_yards" ? "att" : volumeKind(stat);
    const u = (prof.usage || {})[kind];
    const roleTxt = () => {
      const what = {tgt: "share of the team's targets", car: "share of the team's carries", att: "pass attempts"}[kind];
      const f = kind === "att" ? (x => `${fmtNum(x)} a game`) : (x => `${Math.round(x * 100)}%`);
      return `His ${what}: ${f(u.recent)} over his last ${u.n} games, ${u.dir === "up" ? "up" : "down"} from `
        + `${f(u.base)} in the ${u.nbase} before. His hit rate is built mostly on the old role, `
        + (u.dir === "up" ? "so it may understate him now. Nudged up." : "so it may overstate him now. Marked down.");
    };
    if(u && u.dir === "up"){ tilt += 0.15; why.push(["Role growing", "up", roleTxt()]); }
    if(u && u.dir === "down"){ tilt -= 0.15; why.push(["Role shrinking", "down", roleTxt()]); }

    const dfn = defenseFor(r), faced = (prof.faced || {})[r.market];
    // Early in the season the defense ranks are mostly last year's teams.
    // In week 3 "soft matchup" legs hit LESS often than expected and "tough"
    // ones more, so the matchup waits until defenses have 4 games this year.
    if(dfn && faced != null && (!ALGO_V2 || (dfn.games || 0) >= 4)){
      const gap = dfn.rank - faced;
      const unit = (SHARED.units || {})[r.market] || "";
      const base = `${dfn.team} ranks ${ordinal(dfn.rank)} of ${dfn.of} against ${r.pos}s in ${unit} allowed `
        + `(${dfn.perGame} a game; 1st allows the least). The defenses behind his hit rate averaged ${ordinal(Math.round(faced))}`;
      if(gap >= 6){ tilt += 0.10; why.push(["Soft matchup", "up",
        base + ` — this one is easier than he usually sees. Nudged up.`]); }
      else if(gap <= -6){ tilt -= 0.10; why.push(["Tough matchup", "down",
        base + ` — this one is harder than he usually sees, so read his hit rate as a ceiling. Marked down.`]); }
    }

    const gl = (s.lines || {})[r.game];
    if(gl && gl.fav){
      const big = sportKey === "cfb" ? 14 : 7;
      const passing = ["passing_yards", "receptions", "receiving_yards"].includes(stat);
      const sp = fmtNum(gl.spread);
      if(sportKey === "cfb" && r.team === gl.fav && gl.spread >= 21){ tilt -= 0.15; why.push(["Blowout risk", "down",
        `${r.team} is favored by ${sp}. In a blowout, starters often sit in the fourth quarter, which cuts into overs. Marked down.`]); }
      else if(gl.spread >= big && r.team === gl.fav && stat === "rushing_yards"){ tilt += 0.10; why.push(["Run-heavy script", "up",
        `${r.team} is favored by ${sp}, so likely playing with a lead. Teams protecting a lead run the ball more late, which means more carries. Nudged up.`]); }
      else if(gl.spread >= big && r.team === gl.dog && passing){ tilt += 0.10; why.push(["Trailing script", "up",
        `${r.team} is a ${sp}-point underdog, so likely playing from behind. Teams that are behind throw more, especially late — more pass attempts, targets and catches. Nudged up.`]); }
      else if(gl.spread >= big && r.team === gl.dog && stat === "rushing_yards"){ tilt -= 0.10; why.push(["Trailing script", "down",
        `${r.team} is a ${sp}-point underdog, so likely playing from behind. Teams that are behind run less, which means fewer carries. Marked down.`]); }
    }

    const vk = volumeKind(stat), vmin = vk === "car" ? 0.25 : 0.10;
    const gone = ((s.outs || {})[r.team] || []).filter(o =>
      normName(o.player) !== normName(r.player) && (o[vk] || 0) >= vmin);
    if(gone.length){
      const who = gone.map(o => `${o.player} (${o.pos}, ${o.status.toLowerCase()})`).join(", ");
      if(stat === "passing_yards"){ tilt -= 0.05; why.push(["Top target out", "down",
        `${who} won't play. Fewer proven receivers to throw to. Marked down slightly.`]); }
      else { tilt += 0.05; why.push(["Teammate out", "up",
        `${who} won't play, leaving ${gone.map(o => Math.round((o[vk] || 0) * 100) + "%").join(" + ")} of the team's `
        + `${vk === "car" ? "carries" : "targets"} to go to someone else. Nudged up slightly.`]); }
    }
    const qo = qbOut(r.team, r.player);
    if(qo && (stat === "receptions" || stat === "receiving_yards" || (stat === "passing_yards" && r.pos === "QB"))){
      tilt -= 0.15; why.push(["Backup QB", "down", qbOutText(qo, stat, r.pos) + " Marked down."]);
    }
    if(status === "Questionable"){ tilt -= 0.30; why.push(["Questionable", "down",
      `Listed questionable${prof.status.injury ? ` (${prof.status.injury.toLowerCase()})` : ""}. Check the inactives about 90 minutes `
      + `before kickoff — and even if he plays, he may play less. Marked down.`]); }
    // Two more cautions the board shows on the card. No nudge to the rate;
    // they matter because the generator only uses legs without a caution.
    const medV = median(vals);
    if(stat !== "receptions" && medV != null && r.std_line != null && medV < r.std_line && r.mean > r.std_line)
      why.push(["Big-game average", "down",
        `His average (${r.mean.toFixed(1)}) clears the ${r.std_line} line, but his typical game — the median — is ${fmtNum(medV)}. `
        + `A few big games pull the average up; in most games he has finished under the line.`]);
    const withTeam = r.with_team == null ? r.games : r.with_team;
    if(r.games - withTeam > 0 && withTeam < r.games / 2) why.push(["Mostly with another team", "down",
      `Only ${withTeam} of his ${r.games} games were with ${r.team}; the rest came with ${(r.prior_teams || []).join(" and ") || "another team"}. `
      + `Talent travels between teams, but how much he's used doesn't.`]);

    tilt = Math.max(-PG_TILT_CAP, Math.min(PG_TILT_CAP, tilt));
    p = sigm(logit(clampP(p)) + tilt);
    // LONG SHOTS. On a leg that pays more than it risks, the board's history
    // may not rate it far above what the sportsbook does. Week 3: long-shot
    // legs the board rated 10+ points above the book hit ~30%, not the 42-54%
    // the board said -- and the long-odds parlays were built on exactly those,
    // because the search goes looking for legs the board likes most. A small
    // edge is allowed (those did hit a bit more often than the book said).
    if(ALGO_V2 && r.price > 0) p = Math.min(p, q + PG_LONGSHOT_EDGE);
    return {p, q, why};
  });
}

/* Every line the chosen book can put on a slip, rated, one option-list per
   player. Options that are both less likely AND pay less than another rung of
   the same player can never be part of the best parlay, so they are dropped. */
const RATE_CACHE = new WeakMap();
function pgPool(book, scope, exclude, strict, noAlone){
  // Scope: a Set of "sport|game" keys ticked in the Games picker.
  const pick = scope instanceof Set ? scope : null;
  const players = new Map();
  for(const [key, sp] of Object.entries(SPORTS)){
    if(pick && ![...pick].some(k => k.startsWith(key + "|"))) continue;
    for(const r of (sp.rows || [])){
      if(r.book !== book || !legId(r)) continue;
      if(pick && !pick.has(key + "|" + r.game)) continue;
      // A line's rating never changes while the page is open, so it is
      // worked out once and reused by every search (and Regenerate).
      let rated = RATE_CACHE.get(r);
      if(rated === undefined){ rated = rateLeg(key, r); RATE_CACHE.set(r, rated); }
      if(!rated) continue;
      // CLEAN LEGS ONLY. A pick the board itself flags with a caution --
      // tough matchup, shrinking role, unrecorded games, questionable --
      // is left out, even when its estimate is high. The estimate already
      // marks it down; this keeps every leg of a suggested parlay one the
      // board has nothing against.
      const downs = rated.why.filter(w => w[1] === "down").length;
      if(strict === true && downs) continue;
      const d = decOf(r.price);
      if(d <= 1.0001) continue;
      const pk = key + "|" + normName(r.player) + "|" + r.team;
      if(exclude && exclude.has(pk)) continue;
      if(!players.has(pk)) players.set(pk, []);
      // "soft": when there aren't enough all-green legs, amber legs are
      // allowed but each amber flag counts heavily against the leg, so the
      // fewest and mildest cautions get in.
      const lp = Math.log(rated.p) - (strict === "soft" ? PG_AMBER_COST * downs : 0);
      players.get(pk).push({r, sport: key, pk, p: rated.p, q: rated.q, why: rated.why,
                            d, lp, ld: Math.log(d), downs});
    }
  }
  // STACKS. A quarterback's passing yards and his own receivers' numbers
  // rise and fall together: in 2,133 QB-receiver games (2024-26), when each
  // cleared a line he clears ~40% of the time, both did 22% of the time --
  // not the 15% two unrelated legs would. So a QB line plus one of his
  // WR/TE lines is also offered as a single two-leg option, rated with that
  // link. The link is small for near-locks and large for longer shots,
  // which is exactly where long-odds parlays need help.
  const combos = new Map();                     // QB group key -> combo options
  if(ALGO_V2 && !(noAlone && noAlone.stackOff)){
    const byTeam = new Map();
    for(const [pk, opts] of players){
      const o = opts[0], k = o.sport + "|" + o.r.team;
      if(!byTeam.has(k)) byTeam.set(k, []);
      byTeam.get(k).push([pk, opts]);
    }
    const statOf = o => ((SHARED.marketMeta || {})[o.r.market] || {}).stat;
    for(const group of byTeam.values()){
      const qbs = group.filter(([, os]) => os[0].r.pos === "QB");
      const recs = group.filter(([, os]) => ["WR", "TE"].includes(os[0].r.pos));
      for(const [qk, qopts] of qbs){
        const pass = qopts.filter(o => statOf(o) === "passing_yards");
        for(const [rk, ropts] of recs){
          const catches = ropts.filter(o => ["receiving_yards", "receptions"].includes(statOf(o)));
          for(const a of pass) for(const b of catches){
            const link = PG_STACK_PHI * Math.sqrt(a.p * (1 - a.p) * b.p * (1 - b.p));
            const pab = Math.min(a.p * b.p + link, a.p, b.p);
            const txt = `${a.r.player} and ${b.r.player} play for the same offense: when he throws for more, `
              + `his receivers catch more. Legs like these land together more often than two unrelated legs — `
              + `the estimate for this parlay counts that.`;
            const pa = Object.assign({}, a, {why: a.why.concat([[`Stacked with ${b.r.player.split(" ").slice(-1)[0]}`, "up", txt]])});
            const pb = Object.assign({}, b, {why: b.why.concat([[`Stacked with ${a.r.player.split(" ").slice(-1)[0]}`, "up", txt]])});
            if(!combos.has(qk)) combos.set(qk, []);
            combos.get(qk).push({combo: true, parts: [pa, pb], pk: qk, pk2: rk, w: 2,
              p: pab, d: a.d * b.d, ld: Math.log(a.d * b.d),
              lp: Math.log(pab) - (strict === "soft" ? PG_AMBER_COST * ((a.downs || 0) + (b.downs || 0)) : 0)});
          }
        }
      }
    }
  }
  const frontier = (opts, cap) => {
    opts.sort((a, b) => b.d - a.d || b.lp - a.lp);
    const keep = []; let bestP = -Infinity;
    for(const o of opts){ if(o.lp > bestP + 1e-9){ keep.push(o); bestP = o.lp; } }
    return keep.slice(0, cap);
  };
  const out = [];
  for(const [pk, opts] of players){
    const single = (noAlone && noAlone.has(pk)) ? [] : frontier(opts.map(o => Object.assign(o, {w: 1})), 60);
    const both = single.concat(combos.has(pk) ? frontier(combos.get(pk), 60) : []);
    if(both.length) out.push(both);
  }
  return out;
}

/* Exact 0/1 knapsack over players: n legs, one per player, combined log-odds
   binned at 0.01, maximising the summed log-probability. The exact sum of
   the best path is carried per bin, so rounding never accumulates. */
function buildParlay(nLegs, targetAmer, book, scope, exclude, strict){
  // A receiver picked inside a stack must not also be picked on his own:
  // if that happens, rebuild with him available only through the stack.
  const noAlone = new Set();
  for(let tries = 0; tries < 6; tries++){
    const res = buildParlayOnce(nLegs, targetAmer, book, scope, exclude, strict, noAlone);
    if(res.error || !res.clash) return res;
    noAlone.add(res.clash);
  }
  noAlone.stackOff = true;
  return buildParlayOnce(nLegs, targetAmer, book, scope, exclude, strict, noAlone);
}

function buildParlayOnce(nLegs, targetAmer, book, scope, exclude, strict, noAlone){
  const players = pgPool(book, scope, exclude, strict, noAlone);
  if(players.length < nLegs && !players.some(os => os.some(o => o.w === 2))){
    return {error: `Only ${players.length} player${players.length === 1 ? " has" : "s have"} `
      + `${bookName(book)} lines in this selection. Pick ${players.length} leg${players.length === 1 ? "" : "s"} or fewer, `
      + `or widen the games.`};
  }
  const target = Math.log(decOf(targetAmer));
  const maxLd = players.reduce((a, opts) => a + Math.max(...opts.map(o => o.ld)), 0);
  const top = Math.min(maxLd, target + 1.2), N = nLegs;
  const budget = Math.floor(6e6 / ((N + 1) * players.length));
  const W = Math.max(0.0005, top / Math.max(200, Math.min(4000, budget)));
  const B = Math.ceil(top / W) + 2;
  const NEG = -Infinity;
  const score = [], sums = [];
  for(let c = 0; c <= N; c++){ score.push(new Float64Array(B).fill(NEG)); sums.push(new Float64Array(B)); }
  score[0][0] = 0;
  const choice = [];
  let reach = 0;
  players.forEach(opts => {
    const ch = new Int32Array((N + 1) * B);
    reach = Math.min(N, reach + Math.max(...opts.map(o => o.w)));
    for(let c = reach; c >= 1; c--){
      const curS = score[c], curSum = sums[c];
      for(let o = 0; o < opts.length; o++){
        const w = opts[o].w;
        if(c - w < 0) continue;
        const prevS = score[c - w], prevSum = sums[c - w];
        for(let b = 0; b < B; b++){
          const base = prevS[b];
          if(base === NEG) continue;
          const ns = prevSum[b] + opts[o].ld, nb = Math.round(ns / W);
          if(nb >= B) continue;
          const v = base + opts[o].lp;
          if(v > curS[nb]){ curS[nb] = v; curSum[nb] = ns; ch[c * B + nb] = (b << 7) | (o + 1); }
        }
      }
    }
    choice.push(ch);
  });

  // Inside +/-10% of the target payout, take the most likely; if nothing
  // lands there, the closest payout that can be built.
  const tol = Math.log(1.10), fin = score[N], finSum = sums[N];
  let best = -1, inBand = false;
  for(let b = 0; b < B; b++){
    if(fin[b] === NEG) continue;
    const ok = Math.abs(finSum[b] - target) <= tol;
    if(ok && (!inBand || fin[b] > fin[best])){ best = b; inBand = true; }
    else if(!inBand && (best < 0 || Math.abs(finSum[b] - target) < Math.abs(finSum[best] - target))) best = b;
  }
  if(best < 0) return {error: "No combination of those lines could be built."};

  const picks = []; let c = N, b = best;
  for(let i = players.length - 1; i >= 0 && c > 0; i--){
    const v = choice[i][c * B + b];
    if(!v) continue;
    const o = players[i][(v & 127) - 1];
    picks.push(o);
    b = v >> 7; c -= o.w;
  }
  picks.reverse();
  // Same receiver on his own AND inside a stack: report it for a rebuild.
  const alone = new Set(picks.filter(o => !o.combo).map(o => o.pk));
  const clash = picks.filter(o => o.combo).map(o => o.pk2).find(k => alone.has(k));
  if(clash) return {clash};
  const legs = picks.flatMap(o => o.combo ? o.parts : [o]);
  const d = legs.reduce((a, o) => a * o.d, 1);
  const prob = picks.reduce((a, o) => a * o.p, 1);
  return {legs, d, prob, inBand, book, target: targetAmer, nLegs, scope,
          stacks: picks.filter(o => o.combo).length};
}

/* Clean legs first. Only when there are not enough of them for the legs
   asked for does it fall back to the whole pool -- and says so. */
function buildBest(nLegs, targetAmer, book, scope, exclude, green){
  if(green === false){
    const r = buildParlay(nLegs, targetAmer, book, scope, exclude, false);
    if(!r.error) r.green = false;
    return r;
  }
  const res = buildParlay(nLegs, targetAmer, book, scope, exclude, true);
  if(!res.error) return res;
  const any = buildParlay(nLegs, targetAmer, book, scope, exclude, "soft");
  if(any.error) return res;
  any.mixed = true;
  return any;
}

/* REGENERATE. The first build is the best parlay the board can make; it is
   deterministic, so asking again gives the same answer. Regenerate asks for
   the best parlay using NONE of the players in any option so far -- new
   people, not just new rungs -- and the estimate shows what that variety
   costs. Every option is kept, so Back and Next move between them. */
let PG_LAST = null, PG_HIST = [], PG_IDX = -1, PG_SCOPE = null;

/* NO REPEATS ACROSS YOUR BETS. Players already in a parlay you took -- added
   to the slip, or opened in the sportsbook -- are left out of the next one,
   so a single miss can only sink one of your bets. Building and browsing
   options doesn't count; only parlays you actually took. Remembered per
   board in this browser, so it starts clean with each new board. */
const PG_BET_KEY = "propboard_bet:" + Object.values(SPORTS).map(x => x.stamp).join("|");
let PG_BET = new Set();
try{ PG_BET = new Set(JSON.parse(localStorage.getItem(PG_BET_KEY) || "[]")); }catch(e){}
function pgKeyOf(sport, r){ return sport + "|" + normName(r.player) + "|" + r.team; }
function pgSkip(){
  const skip = new Set(PG_BET);
  for(const r of SLIP.values()){
    for(const [k, sp] of Object.entries(SPORTS)) if((sp.rows || []).includes(r)) skip.add(pgKeyOf(k, r));
  }
  return skip;
}
function pgTook(res){
  if(!res || res.error) return;
  res.legs.forEach(o => PG_BET.add(o.pk));
  try{ localStorage.setItem(PG_BET_KEY, JSON.stringify([...PG_BET])); }catch(e){}
}
/* Build leaving out players already in your bets; if that leaves too few,
   allow repeats and say so. */
function buildSpread(nLegs, target, book, scope, extra, green){
  const skip = new Set([...pgSkip(), ...(extra || [])]);
  let res = buildBest(nLegs, target, book, scope, skip, green);
  if(res.error && skip.size){
    res = buildBest(nLegs, target, book, scope, extra ? new Set(extra) : null, green);
    if(!res.error) res.repeats = true;
  }
  return res;
}


function pgShow(i){
  PG_IDX = i;
  pgRender(PG_HIST[i]);
}
function pgRegenerate(){
  const base = PG_HIST[0];
  if(!base) return;
  const used = new Set(PG_HIST.flatMap(h => h.legs.map(o => o.pk)));
  let res = buildSpread(base.nLegs, base.target, base.book, base.scope, used, base.green !== false);
  let reused = false;
  if(res.error){
    // Out of fresh players: allow earlier options' players back, keeping
    // only the one on screen out, so the next option still differs from it.
    const cur = new Set(PG_HIST[PG_IDX].legs.map(o => o.pk));
    res = buildSpread(base.nLegs, base.target, base.book, base.scope, cur, base.green !== false);
    reused = true;
  }
  if(res.error){
    $("pg-note").innerHTML = `<div class="pg-warn">That's every distinct parlay this
      selection can make. Widen the games or use fewer legs for more options.</div>`;
    return;
  }
  res.reused = reused;
  res.green = base.green;
  PG_HIST.push(res);
  pgShow(PG_HIST.length - 1);
}

function pgRender(res){
  const out = $("pg-out");
  if(res.error){ out.innerHTML = `<div class="pg-warn">${esc(res.error)}</div>`; return; }
  PG_LAST = res;
  const target = res.target, name = bookName(res.book);
  const n = PG_HIST.length, i = PG_IDX;
  const nav = `<div class="pg-nav">
      <button class="pg-arrow" id="pg-prev" ${i <= 0 ? "disabled" : ""} aria-label="Previous option">&#8249;</button>
      <span class="pg-count">${i === 0 ? "Best pick" : `Option ${i + 1}`}<small> · ${i + 1} of ${n}</small></span>
      <button class="pg-arrow" id="pg-next" ${i >= n - 1 ? "disabled" : ""} aria-label="Next option">&#8250;</button>
      <button class="pg-regen" id="pg-regen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        Regenerate</button>
    </div>
    <div id="pg-note">${i > 0 ? `<div class="pg-info">${res.reused
        ? "No fresh players left, so this one reuses players from earlier options — but none from the one before."
        : "All-new players. Rated a little lower than the best pick — that's the price of variety."}</div>` : ""}</div>`;
  const odds = amerOf(res.d);
  const sgp = sameGame(res.legs.map(o => o.r));
  const legsHtml = res.legs.map((o, li) => {
    const chips = o.why.map(([t, cls], ci) => `<button type="button" class="pg-chip ${cls}" data-tip="${li}:${ci}"
      aria-expanded="false">${esc(t)}</button>`).join("");
    return `<div class="pg-leg">
      <div class="leg-main">
        <div class="leg-what">${esc(o.r.player)} <span class="pg-pos">${esc(o.r.pos)} · ${esc(o.r.team)}</span></div>
        <div class="leg-prop">${propText(o.r)} <span class="leg-price">${american(o.r.price)}</span></div>
        <div class="leg-where">${esc(o.r.game)}${kickOf(o.r.game) ? ` · ${kickText(o.r.game)}` : ""}</div>
        ${chips ? `<div class="why">${chips}</div><div class="pg-tip" hidden></div>` : ""}
      </div>
      <span class="p" title="Board estimate for this leg">${Math.round(o.p * 100)}%</span>
    </div>`;
  }).join("");
  out.innerHTML = nav + `
    <div class="pg-sum">
      <div class="row"><span class="big">${fmtAmer(odds)}</span>
        <span>${res.legs.length} leg${res.legs.length === 1 ? "" : "s"} at ${name} · target ${fmtAmer(target)}</span></div>
      <div class="row"><span>Board estimate it hits: <b>${(res.prob * 100).toFixed(res.prob < 0.01 ? 2 : 1)}%</b></span>
        <span>$10 pays $${(10 * res.d).toFixed(2)}</span></div>
    </div>
    ${res.repeats ? `<div class="pg-warn">Not enough players left who aren't already in your other bets,
      so this one repeats some. Use fewer legs or tick more games.</div>` : ""}
    ${res.mixed ? `<div class="pg-warn">Not enough green-flag legs for ${res.legs.length}
      legs here, so some below carry an amber warning. Use fewer legs or tick more games
      for an all-green parlay.</div>` : ""}
    ${res.inBand ? "" : `<div class="pg-warn">Nothing on this board lands within 10% of
      ${fmtAmer(target)} with ${res.legs.length} leg${res.legs.length === 1 ? "" : "s"}.
      This is the closest it can build.</div>`}
    ${sgp ? `<div class="pg-warn">Some legs share a game. ${name} prices same-game legs
      together, so its price will differ from ${fmtAmer(odds)}.</div>` : ""}
    ${res.legs.some(o => o.why.length) ? `<p class="pg-hint">Tap a flag to see what it means.</p>` : ""}
    <div style="margin-top:6px">${legsHtml}</div>
    <div class="pg-actions">
      <button class="btn" id="pg-add">Add to slip</button>
      <a class="btn ghost" id="pg-open-book" target="_blank" rel="noopener"
         href="${esc(pgSlipUrl(res))}">Open in ${name}</a>
    </div>
    <p class="pg-fine">How it picks: each line's hit rate is pulled toward the
      book's own price (so small samples can't run wild), blended with the last
      10 games, then nudged a little for role changes, matchup, game script,
      injuries and questionable tags. Games missing from a player's record count
      partly as misses, low-volume receivers are marked down, and players with
      under six recorded games are left out. Only green-flag legs are used —
      anything with an amber warning (boom or bust, shrinking role, unrecorded
      games, questionable…) is skipped — and players already in a parlay you
      took aren't used again. It maximises the chance every leg hits at
      the odds you chose. It is an estimate from past games, not a prediction —
      a parlay only pays if every leg hits.</p>`;
}

function pgSlipUrl(res){
  const saved = new Map(SLIP);
  SLIP.clear(); res.legs.forEach(o => SLIP.set(legId(o.r), o.r));
  const url = slipUrl(res.book);
  SLIP.clear(); saved.forEach((v, k) => SLIP.set(k, v));
  return url;
}

function pgFillForm(){
  const legs = $("pg-legs"), odds = $("pg-odds"), book = $("pg-book");
  if(!legs.options.length){
    for(let i = 1; i <= 25; i++) legs.add(new Option(`${i} leg${i === 1 ? "" : "s"}`, i));
    legs.value = "3";
    [-10000, -5000, -2000, -1000, -500, -300, -200, -150, -110, 100, 150, 200, 300,
     400, 500, 750, 1000, 1500, 2000, 3000, 5000, 7500, 10000, 25000, 50000, 100000]
      .forEach(a => odds.add(new Option(fmtAmer(a), a)));
    odds.value = "500";
  }
  // Games: every TV window of every sport on the board, soonest first.
  // All ticked the first time; kept as left after that.
  const groups = Object.keys(SPORTS).flatMap(k => slotGroups(k).map(g => Object.assign(g, {
    items: g.items.map(i => Object.assign({}, i, {value: k + "|" + i.value}))})));
  const allKeys = groups.flatMap(g => g.items.map(i => i.value));
  if(!PG_SCOPE){ PG_SCOPE = new Set(allKeys); }
  else { [...PG_SCOPE].forEach(v => { if(!allKeys.includes(v)) PG_SCOPE.delete(v); }); }
  multiPick($("pg-scope"), groups, PG_SCOPE, () => {}, "game");

  const books = BOOKS.filter(([b]) => Object.values(SPORTS).some(sp =>
    (sp.rows || []).some(r => r.book === b && legId(r))));
  const prev = book.value;
  book.innerHTML = books.map(([b, n]) => `<option value="${b}">${n}</option>`).join("");
  if(books.some(([b]) => b === prev)) book.value = prev;
  else if(books.some(([b]) => b === $("f-book").value)) book.value = $("f-book").value;
}

$("pg-open").onclick = () => { pgFillForm(); $("pg").hidden = false; document.body.style.overflow = "hidden"; };
$("pg-close").onclick = () => { $("pg").hidden = true; document.body.style.overflow = ""; };
$("pg").addEventListener("click", ev => { if(ev.target === $("pg")) $("pg-close").onclick(); });
$("pg-go").onclick = () => {
  if(!$("pg-book").value){ $("pg-out").innerHTML = `<div class="pg-warn">No lines on this board can be sent to a sportsbook slip.</div>`; return; }
  $("pg-go").textContent = "Building…";
  setTimeout(() => {
    const t0 = performance.now();
    if(!PG_SCOPE || !PG_SCOPE.size){
      $("pg-go").textContent = "Build my parlay";
      $("pg-out").innerHTML = `<div class="pg-warn">Pick at least one game.</div>`;
      return;
    }
    const res = buildSpread(Number($("pg-legs").value), Number($("pg-odds").value),
                          $("pg-book").value, new Set(PG_SCOPE), null, true);
    res.green = true;             // green flags only, always
    PG_HIST = res.error ? [] : [res];
    PG_IDX = res.error ? -1 : 0;
    pgRender(res);
    $("pg-go").textContent = "Build my parlay";
    $("pg-go").dataset.ms = Math.round(performance.now() - t0);
  }, 20);
};
function pgTip(chip){
  const leg = chip.closest(".pg-leg"), tip = leg.querySelector(".pg-tip");
  const wasOpen = chip.getAttribute("aria-expanded") === "true";
  $("pg-out").querySelectorAll('.pg-chip[aria-expanded="true"]').forEach(c => c.setAttribute("aria-expanded", "false"));
  $("pg-out").querySelectorAll(".pg-tip").forEach(t => { t.hidden = true; });
  if(wasOpen) return;
  const [li, ci] = chip.dataset.tip.split(":").map(Number);
  const [label, dir, text] = PG_LAST.legs[li].why[ci];
  tip.className = "pg-tip " + dir;
  tip.innerHTML = `<b>${esc(label)}</b><span class="pg-tip-k">${dir === "up"
      ? "Green · helps this leg" : "Amber · works against this leg"}</span>`
    + `<p>${esc(text || "")}</p>`;
  // Point the arrow at the chip that was tapped.
  tip.hidden = false;
  const cr = chip.getBoundingClientRect(), tr = tip.getBoundingClientRect();
  tip.style.setProperty("--x", Math.max(12, cr.left - tr.left + cr.width / 2 - 7) + "px");
  chip.setAttribute("aria-expanded", "true");
}
$("pg-out").addEventListener("click", ev => {
  const t = ev.target.closest("button, a");
  if(!t){
    $("pg-out").querySelectorAll(".pg-tip").forEach(x => { x.hidden = true; });
    $("pg-out").querySelectorAll('.pg-chip[aria-expanded="true"]').forEach(c => c.setAttribute("aria-expanded", "false"));
    return;
  }
  if(t.classList.contains("pg-chip")){ pgTip(t); return; }
  if(t.id === "pg-prev" && PG_IDX > 0){ pgShow(PG_IDX - 1); return; }
  if(t.id === "pg-next" && PG_IDX < PG_HIST.length - 1){ pgShow(PG_IDX + 1); return; }
  if(t.id === "pg-regen"){
    t.disabled = true; t.lastChild.textContent = " Finding…";
    setTimeout(() => { pgRegenerate(); const b = $("pg-regen");
      if(b){ b.disabled = false; b.lastChild.textContent = " Regenerate"; } }, 20);
    return;
  }
  if(t.id === "pg-open-book"){ pgTook(PG_LAST); return; }     // the link still opens
  if(t.id !== "pg-add" || !PG_LAST) return;
  pgTook(PG_LAST);
  for(const [k, v] of [...SLIP]) if(v.book === PG_LAST.book) SLIP.delete(k);
  PG_LAST.legs.forEach(o => SLIP.set(legId(o.r), o.r));
  saveSlip(); render(); renderSlip();
  $("pg-close").onclick();
});

buildSportSeg();
buildFilters();
$("f-game").onchange = render;
$("f-market").onchange = render;
$("f-book").onchange = render;

$("board").addEventListener("click", ev => {
  const b = ev.target.closest(".addbtn");
  if(b) toggleLeg(b.dataset.leg);
});
$("slip-list").addEventListener("click", ev => {
  const x = ev.target.closest(".leg-x");
  if(x){ toggleLeg(x.dataset.leg); return; }
  if(ev.target.closest("#slip-clear")){
    SLIP.clear(); saveSlip(); render(); renderSlip();
  }
});
$("slip-toggle").onclick = () => {
  const open = $("slip").classList.toggle("open");
  $("slip-toggle").setAttribute("aria-expanded", String(open));
};
loadSlip();

render();
renderSlip();
</script>
</body>
